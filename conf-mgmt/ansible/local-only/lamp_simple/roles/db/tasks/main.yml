---
# This playbook will install mysql and create db user and give permissions.

- name: Install Mysql package
  yum: name={{ item }} state=installed
  with_items:
   - mysql-server
   - MySQL-python

- name: Create Mysql configuration file
  template: src=my.cnf.j2 dest=/etc/my.cnf
  notify: 
  - restart mysql

- name: Start Mysql Service
  service: name=mysqld state=started enabled=true

- name: insert iptables rule
  lineinfile: dest=/etc/sysconfig/iptables state=present regexp="{{ mysql_port }}"
              insertafter="^:OUTPUT " line="-A INPUT -p tcp  --dport {{ mysql_port }} -j  ACCEPT"
  notify: restart iptables

- name: Create Application Database
  mysql_db: name={{ dbname }} state=present

- name: Require an application DB password
  fail: msg="db_password is empty. Set LAMP_DB_PASSWORD or pass db_password with -e or Ansible Vault."
  when: db_password == ''

# Least privilege: access to the application database only, and only from the
# web servers' addresses (the same addresses index.php connects from).
- name: Create Application DB User
  mysql_user:
    name: "{{ dbuser }}"
    password: "{{ db_password }}"
    priv: "{{ dbname }}.*:ALL"
    host: "{{ hostvars[item].ansible_eth0.ipv4.address }}"
    state: present
  with_items: "{{ groups['webservers'] }}"
  no_log: true
